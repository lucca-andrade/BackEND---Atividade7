<!DOCTYPE html>
<html>
<head>
    <title>Lista de Tarefas</title>
</head>
<body>

    <h1>Lista de Tarefas</h1>

    {% for tarefa in tarefas %}

        <p>
            <b>{{ tarefa.titulo }}</b><br>

            {{ tarefa.descricao }}<br>

            Prioridade: {{ tarefa.prioridade }}<br>

            Situação: {{ tarefa.situacao }}<br>

            Categoria: {{ tarefa.categoria }}<br>

            Data: {{ tarefa.data_prevista }}
        </p>

        <hr>

    {% empty %}
        <p>Nenhuma tarefa cadastrada.</p>
    {% endfor %}

    <a href="{% url 'inicio' %}">
        Voltar
    </a>

</body>
</html>
